<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSTV Reborn - Web Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'kstv-red': '#AA151B',
                        'kstv-gold': '#F1BF00',
                        dark: '#0d1117'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        
        /* Focus ultra-visible para D-pad */
        .dpad-btn:focus {
            outline: 4px solid #F1BF00 !important;
            outline-offset: 3px;
            border-color: #F1BF00 !important;
            transform: scale(1.02);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .dpad-btn {
            transition: all 0.15s ease;
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HEDC1XMWWR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-HEDC1XMWWR');
    </script>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased" onload="document.getElementById('card-repo').focus()">

    <!-- Header compacto -->
    <header class="bg-gray-900 border-b-2 border-kstv-red py-4 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-kstv-red"></div>
        <div class="absolute top-1 left-0 w-full h-1 bg-kstv-gold"></div>
        <div class="absolute top-2 left-0 w-full h-1 bg-kstv-red"></div>

        <div class="max-w-4xl mx-auto px-4 flex flex-col items-center justify-center text-center relative z-10 mt-2">
            <h1 class="text-3xl md:text-5xl font-black tracking-tighter uppercase text-white">
                <span class="text-kstv-red">KSTV</span> <span class="text-kstv-gold">RE</span><span class="text-kstv-red">BORN</span>
            </h1>
            <p class="mt-2 text-kstv-gold font-black text-xl tracking-widest bg-gray-800 px-4 py-2 rounded-lg border border-kstv-gold/50">
                Código: 6979514
            </p>
        </div>
    </header>

    <!-- Menú principal - Grid D-pad friendly -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
        
        <h2 class="text-xl font-bold text-white mb-6 border-l-4 border-kstv-gold pl-3">
            <i class="fas fa-th-large text-kstv-gold mr-2"></i> Elige una opción
        </h2>

        <!-- Grid de 2 columnas -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- REPO -->
            <a href="/repo" id="card-repo" class="dpad-btn glass-card rounded-xl p-6 hover:border-kstv-red flex items-center gap-4 group focus:border-kstv-gold" tabindex="0">
                <div class="w-14 h-14 bg-kstv-red rounded-xl flex items-center justify-center text-2xl text-white shadow-lg">
                    <i class="fas fa-download"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-xl font-bold text-white group-hover:text-kstv-red">REPO KODI</h3>
                    <p class="text-gray-400 text-sm mt-1">Instalar repository</p>
                </div>
                <i class="fas fa-chevron-right text-gray-600 group-hover:text-kstv-gold"></i>
            </a>

            <!-- WEBAPP -->
            <a href="/webapp" id="card-webapp" class="dpad-btn glass-card rounded-xl p-6 hover:border-kstv-gold flex items-center gap-4 group focus:border-kstv-gold" tabindex="0">
                <div class="w-14 h-14 bg-kstv-gold rounded-xl flex items-center justify-center text-2xl text-black shadow-lg">
                    <i class="fas fa-rocket"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-xl font-bold text-white group-hover:text-kstv-gold">WEBAPPS</h3>
                    <p class="text-gray-400 text-sm mt-1">Herramientas online</p>
                </div>
                <i class="fas fa-chevron-right text-gray-600 group-hover:text-kstv-gold"></i>
            </a>

            <!-- Descarga directa -->
            <a href="/repo" id="card-download" class="dpad-btn glass-card rounded-xl p-6 hover:border-kstv-red flex items-center gap-4 group focus:border-kstv-gold" tabindex="0">
                <div class="w-14 h-14 bg-gray-700 rounded-xl flex items-center justify-center text-2xl text-white shadow-lg">
                    <i class="fas fa-file-download"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-xl font-bold text-white group-hover:text-kstv-red">DESCARGAS</h3>
                    <p class="text-gray-400 text-sm mt-1">ZIPs del addon</p>
                </div>
                <i class="fas fa-chevron-right text-gray-600 group-hover:text-kstv-gold"></i>
            </a>

            <!-- LABORATORIO -->
            <a href="/webapp/Laboratorio_de_Prompts" id="card-lab" class="dpad-btn glass-card rounded-xl p-6 hover:border-kstv-gold flex items-center gap-4 group focus:border-kstv-gold" tabindex="0">
                <div class="w-14 h-14 bg-purple-600 rounded-xl flex items-center justify-center text-2xl text-white shadow-lg">
                    <i class="fas fa-flask"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-xl font-bold text-white group-hover:text-kstv-gold">LAB IA</h3>
                    <p class="text-gray-400 text-sm mt-1">Prompts y herramientas</p>
                </div>
                <i class="fas fa-chevron-right text-gray-600 group-hover:text-kstv-gold"></i>
            </a>

        </div>

        <!-- Más opciones dinámica -->
        <h2 class="text-xl font-bold text-white mt-10 mb-4 border-l-4 border-kstv-red pl-3">
            <i class="fas fa-folder-open text-kstv-red mr-2"></i> Más secciones
        </h2>
        <div id="dynamic-sections" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            <!-- Cargando... -->
            <div class="col-span-full text-center py-8 text-gray-500">
                <i class="fas fa-circle-notch fa-spin text-2xl"></i>
                <p class="text-sm mt-2">Buscando...</p>
            </div>
        </div>

    </main>

    <footer class="bg-black border-t-4 border-kstv-gold py-4 text-center">
        <p class="text-gray-400 text-sm">KSTV REBORN</p>
        <p class="text-gray-600 text-xs mt-1">
            &copy; 2026 | <span class="text-kstv-red">Made with</span> <i class="fas fa-heart text-kstv-red"></i> <span class="text-kstv-gold">in Spain</span>
        </p>
    </footer>

    <!-- Carga dinámica de carpetas -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('dynamic-sections');
            const ignoreList = ['repo', 'webapp', '.git', '.github'];
            
            // Carpetas especiales para mostrar como cards
            const specialFolders = {
                'repo': { name: 'REPO', icon: 'fa-download', color: 'bg-kstv-red', text: 'text-white' },
                'webapp': { name: 'WEBAPP', icon: 'fa-rocket', color: 'bg-kstv-gold', text: 'text-black' },
                'Laboratorio_de_Prompts': { name: 'LAB IA', icon: 'fa-flask', color: 'bg-purple-600', text: 'text-white' }
            };

            try {
                const resp = await fetch('https://api.github.com/repos/kstvreborn/kstvreborn.github.io/contents');
                const data = await resp.json();
                
                const folders = data.filter(item => item.type === 'dir' && !ignoreList.includes(item.name));
                
                if (folders.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-sm">No hay más secciones</p>';
                    return;
                }

                container.innerHTML = '';
                let focusIndex = 4; // Los primeros 4 ya tienen IDs fijos

                folders.forEach(folder => {
                    const info = specialFolders[folder.name] || { 
                        name: folder.name.replace(/-/g, ' ').toUpperCase().substring(0, 15), 
                        icon: 'fa-folder', 
                        color: 'bg-gray-700', 
                        text: 'text-white' 
                    };
                    
                    const card = document.createElement('a');
                    card.href = `/${folder.name}`;
                    card.className = `dpad-btn glass-card rounded-lg p-4 hover:border-kstv-gold flex flex-col items-center justify-center text-center group focus:border-kstv-gold`;
                    card.tabIndex = 0;
                    
                    card.innerHTML = `
                        <div class="w-10 h-10 ${info.color} rounded-lg flex items-center justify-center text-xl ${info.text} mb-2">
                            <i class="fas ${info.icon}"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-300 group-hover:text-kstv-gold">${info.name}</span>
                    `;
                    
                    container.appendChild(card);
                });

            } catch (e) {
                container.innerHTML = '<p class="text-red-400 text-sm">Error al cargar</p>';
            }
        });
    </script>
</body>
</html>
