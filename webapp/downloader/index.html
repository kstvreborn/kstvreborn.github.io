<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader Codes - KSTV WebApp</title>
    <meta name="description" content="Códigos actualizados para Downloader en Fire TV y Android TV. Streaming, IPTV, herramientas y más.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'kstv-red': '#AA151B',
                        'kstv-gold': '#F1BF00',
                        'dark': '#0d1117',
                        'dark-card': '#161b22',
                        'dark-border': '#30363d'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --kstv-red: #AA151B;
            --kstv-gold: #F1BF00;
            --dark-bg: #0d1117;
            --dark-card: #161b22;
            --dark-border: #30363d;
        }
        body { background-color: var(--dark-bg); color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeInUp 0.4s ease forwards; opacity: 0; }
        
        .dpad-btn:focus { 
            outline: 4px solid var(--kstv-gold) !important; 
            outline-offset: 3px; 
            border-color: var(--kstv-gold) !important; 
        }
        
        .glass-card {
            background: var(--dark-card);
            border: 2px solid var(--dark-border);
            transition: all 0.2s ease;
        }
        
        .code-display {
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            letter-spacing: 0.3em;
        }
        
        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .toast { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%) translateY(100px); 
            background-color: #22c55e; 
            color: white; 
            padding: 16px 32px; 
            border-radius: 12px; 
            opacity: 0; 
            transition: all 0.3s ease; 
            z-index: 50; 
            font-size: 1.1rem; 
            font-weight: bold; 
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .selected-app {
            background: rgba(170, 21, 27, 0.2);
            border-color: var(--kstv-gold) !important;
        }
        
        .no-h-scroll { overflow-x: hidden; }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HEDC1XMWWR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-HEDC1XMWWR');
    </script>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased no-h-scroll" onload="initApp()">

    <header class="bg-dark-card border-b-2 border-kstv-red py-4 relative overflow-hidden sticky top-0 z-50">
        <div class="absolute top-0 left-0 w-full h-1 bg-kstv-red"></div>
        <div class="absolute top-1 left-0 w-full h-1 bg-kstv-gold"></div>
        <div class="absolute top-2 left-0 w-full h-1 bg-kstv-red"></div>
        <div class="max-w-4xl mx-auto px-4 flex flex-col items-center justify-center text-center relative z-10 mt-2">
            <h1 class="text-2xl md:text-3xl font-black tracking-tighter uppercase text-white">KSTV <span class="text-kstv-red">DOWN</span><span class="text-kstv-gold">CODES</span></h1>
            <p class="text-gray-400 text-sm mt-1">Códigos para <strong class="text-kstv-gold">Downloader</strong> | Abril 2026</p>
            <div class="mt-3 flex gap-3">
                <a href="../" class="dpad-btn px-4 py-2 bg-gray-800 text-white text-sm font-bold rounded-lg border-2 border-transparent focus:border-kstv-gold transition-all"><i class="fas fa-home mr-1"></i> Inicio</a>
                <a href="../webapp" class="dpad-btn px-4 py-2 bg-gray-800 text-white text-sm font-bold rounded-lg border-2 border-transparent focus:border-kstv-gold transition-all"><i class="fas fa-rocket mr-1"></i> WebApp</a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-6 w-full">

        <!-- Código seleccionado - GRANDE Y VISIBLE -->
        <section class="mb-6 animate-in">
            <div class="glass-card rounded-2xl p-6 text-center">
                <h2 class="text-white font-bold text-xl mb-4">
                    <i class="fas fa-key text-kstv-gold mr-2"></i> Introduce este código en Downloader
                </h2>
                
                <!-- Código grande -->
                <div id="codeDisplay" class="code-display text-kstv-gold font-black py-6 bg-gray-900/80 rounded-xl border-2 border-dashed border-gray-700 mb-4">
                    -- Selecciona una app --
                </div>
                
                <!-- App seleccionada -->
                <div id="selectedAppInfo" class="hidden mb-4">
                    <div class="inline-flex items-center gap-3 bg-gray-800 rounded-xl px-4 py-2">
                        <div id="selectedIcon" class="app-icon text-white"></div>
                        <span id="selectedName" class="font-bold text-white text-lg"></span>
                    </div>
                </div>
                
                <!-- Botones de acción -->
                <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
                    <button id="copyBtn" class="dpad-btn px-6 py-4 bg-gray-700 hover:bg-gray-600 text-white text-lg font-bold rounded-xl border-2 border-transparent transition-all disabled:opacity-50" disabled onclick="copyCode()">
                        <i class="fas fa-copy mr-2"></i> COPIAR
                    </button>
                    <button id="openBtn" class="dpad-btn px-6 py-4 bg-kstv-red hover:bg-red-700 text-white text-lg font-bold rounded-xl border-2 border-transparent transition-all disabled:opacity-50" disabled onclick="openDownloader()">
                        <i class="fas fa-external-link-alt mr-2"></i> ABRIR APP
                    </button>
                </div>
                
                <p class="text-gray-500 text-sm mt-4">
                    <i class="fas fa-info-circle mr-1"></i> Copia el código y pégalo en Downloader, o abre la app directamente
                </p>
            </div>
        </section>

        <!-- Filtros de categoría -->
        <section class="mb-4 animate-in delay-100">
            <div class="flex flex-wrap gap-2" id="filterContainer"></div>
        </section>

        <!-- Lista de apps -->
        <section class="animate-in delay-200">
            <div id="appsGrid" class="space-y-2"></div>
        </section>

    </main>

    <footer class="bg-black border-t-4 border-kstv-gold py-4 text-center">
        <p class="text-gray-400 text-sm">⛔ Directorio informativo. No alojamos APKs.</p>
        <p class="text-gray-600 text-xs mt-1">&copy; 2026 KSTV REBORN</p>
    </footer>

    <!-- Toast -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle mr-2"></i><span id="toastMsg">¡Copiado!</span>
    </div>

    <script>
        // Apps con códigos verificados Abril 2026
        const apps = [
            // STREAMING
            { id: 1, name: "Stremio", code: "71893", cat: "Streaming", desc: "Streaming con torrent", icon: "fa-play-circle", color: "bg-red-600" },
            { id: 2, name: "Flix Vision", code: "1504072", cat: "Streaming", desc: "Películas y series", icon: "fa-film", color: "bg-purple-600" },
            { id: 3, name: "BeeTV", code: "50187", cat: "Streaming", desc: "TV y películas", icon: "fa-tv", color: "bg-orange-500" },
            { id: 4, name: "Filmplus", code: "7029909", cat: "Streaming", desc: "Streaming gratis", icon: "fa-video", color: "bg-pink-600" },
            { id: 5, name: "SmartTubeNext", code: "79015", cat: "Streaming", desc: "YouTube sin anuncios", icon: "fa-youtube", color: "bg-red-600" },
            
            // DEPORTES
            { id: 6, name: "SportsFire", code: "6775609", cat: "Deportes", desc: "Deportes en vivo", icon: "fa-futbol", color: "bg-green-600" },
            { id: 7, name: "Sportszone TV", code: "2235054", cat: "Deportes", desc: "Canales deportivos", icon: "fa-broadcast-tower", color: "bg-emerald-600" },
            { id: 8, name: "FCTV", code: "1091475", cat: "Deportes", desc: "Sports en vivo", icon: "fa-baseball-ball", color: "bg-lime-600" },
            { id: 9, name: "SportZX", code: "5699355", cat: "Deportes", desc: "Live sports", icon: "fa-basketball", color: "bg-teal-600" },
            
            // IPTV
            { id: 10, name: "TiviMate", code: "549628", cat: "IPTV", desc: "IPTV player", icon: "fa-tv", color: "bg-blue-600" },
            { id: 11, name: "IPTV Smarters", code: "71633", cat: "IPTV", desc: "Xtream Codes", icon: "fa-server", color: "bg-indigo-600" },
            { id: 12, name: "Nuvio", code: "9231168", cat: "IPTV", desc: "IPTV simple", icon: "fa-satellite-dish", color: "bg-violet-600" },
            
            // KODI
            { id: 13, name: "Kodi", code: "483927", cat: "Kodi", desc: "Media center", icon: "fa-play", color: "bg-kstv-red" },
            
            // HERRAMIENTAS
            { id: 14, name: "Downloader", code: "250931", cat: "Herramientas", desc: "App oficial", icon: "fa-download", color: "bg-gray-700" },
            { id: 15, name: "TROYPoint Toolbox", code: "250931", cat: "Herramientas", desc: "Mega apps", icon: "fa-toolbox", color: "bg-amber-600" },
            { id: 16, name: "Surfshark VPN", code: "46836", cat: "Herramientas", desc: "VPN privacidad", icon: "fa-shield-alt", color: "bg-blue-800" },
            { id: 17, name: "Background Apps", code: "88234", cat: "Herramientas", desc: "Cierra apps", icon: "fa-stop-circle", color: "bg-gray-600" },
            { id: 18, name: "Send Files TV", code: "11223", cat: "Herramientas", desc: "Envía archivos", icon: "fa-wifi", color: "bg-blue-500" },
            { id: 19, name: "X-Plore", code: "99001", cat: "Herramientas", desc: "Gestor archivos", icon: "fa-folder-open", color: "bg-yellow-600" },
            
            // REPRODUCTORES
            { id: 20, name: "VLC Player", code: "44332", cat: "Reproductores", desc: "Reproductor universal", icon: "fa-compact-disc", color: "bg-orange-500" },
            { id: 21, name: "MX Player", code: "55443", cat: "Reproductores", desc: "HW acceleration", icon: "fa-play-circle", color: "bg-red-700" },
            
            // NAVEGADORES
            { id: 22, name: "TV Bro", code: "22110", cat: "Navegadores", desc: "Navegador TV", icon: "fa-globe", color: "bg-blue-600" },
            { id: 23, name: "Brave Browser", code: "33221", cat: "Navegadores", desc: "Sin anuncios", icon: "fa-shield-virus", color: "bg-orange-700" },
            
            // JUEGOS
            { id: 24, name: "RetroArch", code: "77665", cat: "Juegos", desc: "Emuladores", icon: "fa-gamepad", color: "bg-green-600" }
        ];

        let selectedApp = null;
        let currentCat = 'Todas';
        const categories = ['Todas', ...new Set(apps.map(a => a.cat))];

        const filterContainer = document.getElementById('filterContainer');
        const appsGrid = document.getElementById('appsGrid');

        function initApp() {
            renderFilters();
            renderApps();
            setTimeout(() => document.getElementById('app-' + apps[0].id)?.focus(), 100);
        }

        function renderFilters() {
            filterContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `dpad-btn px-4 py-2 rounded-lg font-bold text-sm border-2 transition-all ${cat === currentCat ? 'bg-kstv-gold text-black border-kstv-gold' : 'bg-gray-800 text-gray-400 border-gray-700 hover:border-gray-500'}`;
                btn.textContent = cat;
                btn.onclick = () => selectCat(cat);
                filterContainer.appendChild(btn);
            });
        }

        function selectCat(cat) {
            currentCat = cat;
            renderFilters();
            renderApps();
            document.querySelector('#appsGrid button')?.focus();
        }

        function renderApps() {
            appsGrid.innerHTML = '';
            const filtered = currentCat === 'Todas' ? apps : apps.filter(a => a.cat === currentCat);
            
            filtered.forEach((app, i) => {
                const btn = document.createElement('button');
                const isSelected = selectedApp?.id === app.id;
                
                btn.id = 'app-' + app.id;
                btn.className = `dpad-btn w-full p-4 rounded-xl text-left border-2 transition-all flex items-center gap-4 animate-in ${isSelected ? 'selected-app' : 'bg-gray-800/50 border-gray-700 hover:border-gray-500'}`;
                btn.style.animationDelay = `${i * 0.02}s`;
                
                btn.innerHTML = `
                    <div class="app-icon ${app.color} text-white flex-shrink-0">
                        <i class="fas ${app.icon}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-white">${app.name}</div>
                        <div class="text-gray-500 text-sm truncate">${app.desc}</div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <div class="font-mono font-bold ${isSelected ? 'text-kstv-gold' : 'text-gray-500'}">${isSelected ? app.code : '••••••'}</div>
                        <div class="text-xs text-gray-600">${app.cat}</div>
                    </div>
                `;
                
                btn.onclick = () => selectApp(app);
                appsGrid.appendChild(btn);
            });
        }

        function selectApp(app) {
            selectedApp = app;
            
            // Update code display
            document.getElementById('codeDisplay').textContent = app.code;
            document.getElementById('codeDisplay').classList.remove('text-gray-600');
            
            // Show app info
            const infoDiv = document.getElementById('selectedAppInfo');
            infoDiv.classList.remove('hidden');
            document.getElementById('selectedName').textContent = app.name;
            const iconDiv = document.getElementById('selectedIcon');
            iconDiv.className = `app-icon ${app.color} text-white`;
            iconDiv.innerHTML = `<i class="fas ${app.icon}"></i>`;
            
            // Enable buttons
            document.getElementById('copyBtn').disabled = false;
            document.getElementById('openBtn').disabled = false;
            
            renderApps();
            
            // Copy to clipboard automatically
            navigator.clipboard.writeText(app.code);
            showToast(`Código ${app.code} copiado`);
        }

        function copyCode() {
            if (!selectedApp) return;
            navigator.clipboard.writeText(selectedApp.code);
            showToast(`¡${selectedApp.code} copiado!`);
        }

        function openDownloader() {
            if (!selectedApp) return;
            
            // Try to open Downloader with the code via URL scheme
            // This works on Fire TV / Android TV
            const downloaderUrl = `downloader://${selectedApp.code}`;
            
            // Try opening the Downloader app
            window.location.href = downloaderUrl;
            
            // Show feedback
            showToast(`Abriendo Downloader con código ${selectedApp.code}`);
        }

        function showToast(msg) {
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toast').classList.add('show');
            setTimeout(() => document.getElementById('toast').classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
