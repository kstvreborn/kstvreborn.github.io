<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSTV WebApp - Herramientas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'kstv-red': '#AA151B',
                        'kstv-gold': '#F1BF00',
                        dark: '#0d1117'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .dpad-btn:focus { outline: 4px solid #F1BF00 !important; outline-offset: 3px; border-color: #F1BF00 !important; transform: scale(1.02); }
        .glass-card { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); }
        .step { transition: all 0.15s ease; }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HEDC1XMWWR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-HEDC1XMWWR');
    </script>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased" onload="document.getElementById('tool-0').focus()">

    <!-- Header -->
    <header class="bg-gray-900 border-b-2 border-kstv-red py-4 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-kstv-red"></div>
        <div class="absolute top-1 left-0 w-full h-1 bg-kstv-gold"></div>
        <div class="absolute top-2 left-0 w-full h-1 bg-kstv-red"></div>
        <div class="max-w-4xl mx-auto px-4 flex flex-col items-center mt-2">
            <h1 class="text-3xl font-black uppercase text-white"><span class="text-kstv-red">KSTV</span> <span class="text-kstv-gold">WEBAPP</span></h1>
            <p class="text-gray-400 text-sm mt-1">Herramientas oficiales</p>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">

        <!-- Grid de herramientas -->
        <div id="toolsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-8 text-gray-500">
                <i class="fas fa-circle-notch fa-spin text-2xl"></i>
                <p class="mt-2">Cargando herramientas...</p>
            </div>
        </div>

        <!-- Volver -->
        <div class="mt-10 text-center">
            <a href="../" class="dpad-btn inline-block px-6 py-3 bg-gray-800 text-white rounded-lg font-bold hover:border-kstv-gold border-2 border-transparent" tabindex="0">
                <i class="fas fa-home mr-2"></i> Volver al Inicio
            </a>
        </div>

    </main>

    <footer class="bg-black border-t-4 border-kstv-gold py-4 text-center">
        <p class="text-gray-400 text-sm">KSTV REBORN &copy; 2026</p>
    </footer>

    <script>
        const folders = [
            { name: 'downloader', display: 'DOWNLOADER', icon: 'fa-download', color: 'bg-kstv-red', desc: 'Códigos Downloader' },
            { name: 'Laboratorio_de_Prompts', display: 'LAB IA', icon: 'fa-flask', color: 'bg-purple-600', desc: 'Laboratorio IA' }
        ];

        const container = document.getElementById('toolsGrid');
        
        function renderTools() {
            container.innerHTML = '';
            folders.forEach((folder, index) => {
                const card = document.createElement('a');
                card.id = 'tool-' + index;
                card.href = folder.name + '/';
                card.className = `dpad-btn glass-card rounded-xl p-6 hover:border-kstv-gold flex flex-col items-center justify-center text-center group`;
                card.tabIndex = 0;
                card.innerHTML = `
                    <div class="w-14 h-14 ${folder.color} rounded-xl flex items-center justify-center text-2xl text-white mb-3">
                        <i class="fas ${folder.icon}"></i>
                    </div>
                    <div class="font-bold text-white text-lg group-hover:text-kstv-gold">${folder.display}</div>
                    <div class="text-gray-500 text-xs mt-1">${folder.desc}</div>
                `;
                container.appendChild(card);
            });
            
            // Cargar más carpetas dinámicas
            fetch('https://api.github.com/repos/kstvreborn/kstvreborn.github.io/contents/webapp')
                .then(r => r.json())
                .then(files => {
                    const extra = files.filter(f => f.type === 'dir' && !folders.find(x => x.name === f.name));
                    if (extra.length === 0) return;
                    
                    extra.forEach((folder, i) => {
                        const card = document.createElement('a');
                        card.id = 'tool-' + (folders.length + i);
                        card.href = folder.name + '/';
                        card.className = 'dpad-btn glass-card rounded-xl p-6 hover:border-kstv-gold flex flex-col items-center justify-center text-center group';
                        card.tabIndex = 0;
                        card.innerHTML = `
                            <div class="w-14 h-14 bg-gray-700 rounded-xl flex items-center justify-center text-2xl text-white mb-3">
                                <i class="fas fa-folder"></i>
                            </div>
                            <div class="font-bold text-white text-lg group-hover:text-kstv-gold">${folder.name.replace(/-/g,' ').toUpperCase()}</div>
                        `;
                        container.appendChild(card);
                    });
                });
        }
        
        document.addEventListener('DOMContentLoaded', renderTools);
    </script>
</body>
</html>
